# Logsy — default values.
#
# Postgres and Redis are NOT part of this chart. Point `config.databaseUrl` and
# `config.redisUrl` at managed instances, or at whatever you already run: a
# database is a stateful thing with its own backup and upgrade story, and
# bundling one here would only make it easy to lose.

image:
  # Images are <registry>/logsy-server, -worker and -web.
  registry: ghcr.io/hsanjebri
  # Defaults to the chart's appVersion.
  tag: ''
  pullPolicy: IfNotPresent
  pullSecrets: []

# Non-secret configuration. Rendered into a ConfigMap.
config:
  logLevel: info
  # Required.
  databaseUrl: ''
  redisUrl: ''
  # Public URL of this installation; the PR comment's feedback links point here.
  publicUrl: ''
  llm:
    enabled: true
    provider: anthropic
    model: claude-opus-5
    modelFast: ''
    ollamaBaseUrl: ''
    # e.g. groq:openai/gpt-oss-120b,gemini:gemini-flash-latest (see docs/self-hosting.md)
    panel: ''
  # Links a failure to older ones that mean the same thing. Needs pgvector on the
  # database and an embedding model; leave the provider empty to turn it off.
  embeddings:
    provider: ''
    model: ''
    dimensions: 768
  # Both optional: unset means the SDK is never loaded.
  sentryDsn: ''
  otlpEndpoint: ''

# Secrets. Either point at a Secret you manage yourself (recommended: the values
# below would otherwise sit in your release history in plain text) ...
existingSecret: ''
# ... or let the chart create one from these. Keys used from either source:
#   GITHUB_WEBHOOK_SECRET, GITHUB_APP_ID, GITHUB_PRIVATE_KEY,
#   AUTH_SECRET, AUTH_GITHUB_ID, AUTH_GITHUB_SECRET,
#   ANTHROPIC_API_KEY / OPENAI_API_KEY / GROQ_API_KEY / GEMINI_API_KEY
secrets: {}

# Applies pending migrations before each upgrade, as a Helm hook.
migrations:
  enabled: true
  backoffLimit: 3

server:
  replicas: 2
  port: 3000
  resources:
    requests: { cpu: 100m, memory: 192Mi }
    limits: { memory: 512Mi }
  service:
    type: ClusterIP
    port: 80

worker:
  replicas: 1
  concurrency: 5
  resources:
    requests: { cpu: 200m, memory: 384Mi }
    limits: { memory: 1Gi }

web:
  enabled: true
  replicas: 1
  port: 3002
  # Where the dashboard is reachable; used for OAuth callbacks.
  authUrl: ''
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }
  service:
    type: ClusterIP
    port: 80

# One ingress, routing /webhooks to the server and everything else to the dashboard.
ingress:
  enabled: false
  className: ''
  host: logsy.example.com
  annotations: {}
  tls: []

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
