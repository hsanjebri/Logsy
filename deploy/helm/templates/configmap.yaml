{{- if not .Values.config.databaseUrl }}{{ fail "config.databaseUrl is required" }}{{- end }}
{{- if not .Values.config.redisUrl }}{{ fail "config.redisUrl is required" }}{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "logsy.fullname" . }}
  labels: {{- include "logsy.labels" . | nindent 4 }}
data:
  DATABASE_URL: {{ .Values.config.databaseUrl | quote }}
  REDIS_URL: {{ .Values.config.redisUrl | quote }}
