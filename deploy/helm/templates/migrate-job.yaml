{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "logsy.fullname" . }}-migrate-{{ .Release.Revision }}
  labels: {{- include "logsy.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    # Migrations run before the new pods do, and a failure stops the release.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  template:
    metadata:
      labels: {{- include "logsy.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
      containers:
        - name: migrate
          image: {{ include "logsy.image" (dict "root" $ "component" "worker") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "../../packages/db/dist/migrate-cli.js"]
          env:
            {{- include "logsy.commonEnv" . | nindent 12 }}
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
{{- end }}
